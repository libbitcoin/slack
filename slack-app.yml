display_information:
  name: Archive
  description: Mirrors #general to libbitcoin.info/slack.
features:
  bot_user:
    display_name: archive
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - files:read
      - users:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
